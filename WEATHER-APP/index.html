<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/128/1146/1146869.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <link href="src/output.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            width: 100%;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-image: url("https://i.pinimg.com/vwebp/1200x/7f/81/a1/7f81a1a261a5a34c54747cde07d415fb.webp");
            scroll-behavior: smooth;
        }
    </style>
</head>

<body class="bg-slate-100 flex overflow-x-hidden min-h-screen">

    <!-- Sidebar -->
    <aside id="sidebar" aria-label="Primary Navigation"
        class="-translate-x-full fixed top-0 left-0 z-50 w-64 h-full bg-white/70 backdrop-blur-md transform-gpu border-r border-slate-300/60 flex flex-col justify-between transition-transform duration-500">

        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-300/60 py-5 px-4 shrink-0">
            <div class="flex items-center gap-3 min-w-0">
                <img src="https://cdn-icons-png.flaticon.com/128/1146/1146869.png" alt="App Logo"
                    class="w-8 h-8 aspect-square object-contain shrink-0">
                <h2 class="font-bold text-lg truncate text-slate-800">WeatherApp</h2>
            </div>

            <button id="closeSidebarBtn" aria-label="Close Sidebar"
                class="text-slate-400 text-xl hover:text-rose-500 transition-colors duration-200 cursor-pointer p-1 shrink-0">
                <span aria-hidden="true">✕</span>
            </button>
        </div>

        <!-- Navigation -->
        <nav class="flex flex-col justify-start items-start gap-1 pt-4 px-3 mb-auto overflow-y-auto">
            <button
                class="w-full flex justify-start items-center gap-3 text-slate-700 font-bold rounded-2xl hover:bg-blue-500 hover:text-white transition-all duration-300 py-2.5 px-4">
                <img src="https://img.icons8.com/material-outlined/24/home--v2.png" alt="Home"
                    class="w-6 h-6 aspect-square shrink-0">
                <span class="truncate">Home</span>
            </button>

            <button
                class="w-full flex justify-start items-center gap-3 text-slate-700 font-bold rounded-2xl hover:bg-blue-500 hover:text-white transition-all duration-300 py-2.5 px-4">
                <img src="https://img.icons8.com/ios-glyphs/30/search--v1.png" alt="Search"
                    class="w-6 h-6 aspect-square shrink-0">
                <span class="truncate">Search</span>
            </button>

            <button
                class="w-full flex justify-start items-center gap-3 text-slate-700 font-bold rounded-2xl hover:bg-blue-500 hover:text-white transition-all duration-300 py-2.5 px-4">
                <img src="https://img.icons8.com/ios/100/marker--v1.png" alt="Cities"
                    class="w-6 h-6 aspect-square shrink-0">
                <span class="truncate">Cities</span>
            </button>

            <button
                class="w-full flex justify-start items-center gap-3 text-slate-700 font-bold rounded-2xl hover:bg-blue-500 hover:text-white transition-all duration-300 py-2.5 px-4">
                <img src="https://img.icons8.com/material-outlined/24/like--v1.png" alt="Favorites"
                    class="w-6 h-6 aspect-square shrink-0">
                <span class="truncate">Favorites</span>
            </button>
        </nav>

        <!-- Bottom Promo Card -->
        <div
            class="mx-3 mb-4 p-4 rounded-2xl flex flex-col justify-center gap-3 items-center bg-blue-600 shadow-md shrink-0">
            <img src="https://cdn-icons-png.flaticon.com/128/1146/1146869.png" alt="App Logo"
                class="w-10 h-10 aspect-square object-contain shrink-0">
            <p class="font-bold text-white text-xs text-center leading-relaxed">
                Stay ahead of the weather, every day.
            </p>
        </div>
    </aside>

    <main id="mainContent" class="flex-1 transition-all duration-500 ease-in-out p-6">
        <header
            class="flex justify-between items-center py-2 px-4 bg-white/70 backdrop-blur-md w-full h-16 shadow-sm rounded-xl border border-slate-200">
            <button id="openSidebarBtn" aria-label="Open Sidebar"
                class="text-2xl hover:text-indigo-600 transition text-slate-600 select-none p-2 rounded-lg hover:bg-slate-100 cursor-pointer">
                <span class="truncate">☰</span>
            </button>
            <button
                class="w-fit flex justify-start items-center gap-3 hover:bg-slate-100 text-slate-700 cursor-pointer font-bold rounded-2xl  transition-all duration-300 py-2.5 px-4">
                <img src="https://img.icons8.com/ios-glyphs/30/search--v1.png" alt="Search"
                    class="w-6 h-6 aspect-square shrink-0">
                <!-- <span class="truncate">Search</span> -->
            </button>
        </header>


    </main>

    <script src="JS/app-UI.js"></script>
</body>

</html>
