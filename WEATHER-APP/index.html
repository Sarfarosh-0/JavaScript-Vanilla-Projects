<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/128/1146/1146869.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <link href="src/output.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            width: 100%;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-image: url("https://i.pinimg.com/vwebp/1200x/7f/81/a1/7f81a1a261a5a34c54747cde07d415fb.webp");
            scroll-behavior: smooth;
        }
    </style>
</head>

<body class="bg-slate-100 flex overflow-x-hidden min-h-screen">

    <!-- Sidebar -->
    <aside id="sidebar" aria-label="Primary Navigation"
        class="-translate-x-full fixed top-0 left-0 z-50 w-60 h-full bg-white/80 backdrop-blur-xl border-r border-slate-200/80 flex flex-col justify-between transition-transform duration-300 ease-in-out shadow-2xl">

        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-200/80 py-5 px-4 shrink-0">
            <div class="flex items-center gap-3 min-w-0">
                <div class="p-2 rounded-xl bg-sky-500/10 border border-sky-500/20 shrink-0">
                    <img src="https://cdn-icons-png.flaticon.com/128/1146/1146869.png" alt="App Logo"
                        class="w-6 h-6 object-contain">
                </div>
                <h2 class="font-bold text-lg text-slate-800 tracking-wide truncate">WeatherApp</h2>
            </div>

            <button id="closeSidebarBtn" aria-label="Close Sidebar"
                class="text-slate-400 text-xl hover:text-rose-500 transition-all rounded-xl duration-200 p-2 cursor-pointer flex items-center justify-center">
                <span aria-hidden="true">✕</span>
            </button>
        </div>

        <!-- Navigation -->
        <nav class="flex flex-col gap-1.5 p-4 px-3 mb-auto overflow-y-auto">
            <button
                class="w-full flex items-center gap-3.5 text-slate-600 hover:text-sky-600 font-semibold rounded-2xl hover:bg-sky-50 py-3 px-4 transition-all group cursor-pointer">
                <img src="https://img.icons8.com/material-outlined/24/64748b/home--v2.png" alt="Home"
                    class="w-5 h-5 shrink-0 transition-transform group-hover:scale-110">
                <span class="truncate">Home</span>
            </button>

            <button
                class="w-full flex items-center gap-3.5 text-slate-600 hover:text-sky-600 font-semibold rounded-2xl hover:bg-sky-50 py-3 px-4 transition-all group cursor-pointer">
                <img src="https://img.icons8.com/ios-glyphs/30/64748b/search--v1.png" alt="Search"
                    class="w-5 h-5 shrink-0 transition-transform group-hover:scale-110">
                <span class="truncate">Search</span>
            </button>

            <button
                class="w-full flex items-center gap-3.5 text-slate-600 hover:text-sky-600 font-semibold rounded-2xl hover:bg-sky-50 py-3 px-4 transition-all group cursor-pointer">
                <img src="https://img.icons8.com/ios/100/64748b/marker--v1.png" alt="Cities"
                    class="w-5 h-5 shrink-0 transition-transform group-hover:scale-110">
                <span class="truncate">Cities</span>
            </button>

            <button
                class="w-full flex items-center gap-3.5 text-slate-600 hover:text-sky-600 font-semibold rounded-2xl hover:bg-sky-50 py-3 px-4 transition-all group cursor-pointer">
                <img src="https://img.icons8.com/material-outlined/24/64748b/like--v1.png" alt="Favorites"
                    class="w-5 h-5 shrink-0 transition-transform group-hover:scale-110">
                <span class="truncate">Favorites</span>
            </button>
        </nav>

        <!-- Bottom Promo Card -->
        <div
            class="m-4 p-4 rounded-2xl flex flex-col justify-center gap-3 items-center bg-linear-to-br from-sky-500 to-blue-600 shadow-md shadow-sky-500/20 shrink-0 text-center">
            <img src="https://cdn-icons-png.flaticon.com/128/1146/1146869.png" alt="App Logo"
                class="w-7 h-7 object-contain shrink-0">
            <p class="font-bold text-white text-xs leading-relaxed">
                Stay ahead of the weather, every day.
            </p>
        </div>
    </aside>

    <div id="mainContent" class="flex-1 transition-all duration-500 ease-in-out p-6">
        <header
            class="flex justify-between items-center py-2 px-4 bg-white/70 backdrop-blur-md w-full h-16 shadow-xs rounded-2xl border border-slate-200">
            <button id="openSidebarBtn" aria-label="Open Sidebar"
                class="text-2xl hover:text-sky-600 transition text-slate-600 select-none px-3 py-1 rounded-xl hover:bg-slate-100 cursor-pointer">
                <span class="truncate">☰</span>
            </button>
            <button
                class="w-fit flex justify-start items-center gap-3 hover:bg-slate-100 text-slate-700 cursor-pointer font-bold rounded-2xl transition-all duration-300 py-2.5 px-4">
                <img src="https://img.icons8.com/ios-glyphs/30/64748b/search--v1.png" alt="Search"
                    class="w-6 h-6 aspect-square shrink-0">
            </button>
        </header>

        <main class="flex flex-col gap-5 mt-3">
            <div id="currentLocation"
                class="w-full rounded-2xl p-5 sm:p-6 shadow-xl bg-white/80 backdrop-blur-md border border-slate-200/80 flex flex-col gap-6">

                <!-- Top Row: Location & Date -->
                <div id="dateLocation" class="flex flex-col gap-1">
                    <div class="flex gap-2 items-center font-bold text-slate-800 text-base sm:text-lg">
                        <img src="https://img.icons8.com/ios/100/0284c7/marker--v1.png" alt="Location"
                            class="w-4 h-4 shrink-0">
                        <span id="currentCity" class="after:content-[',_']">New York</span>
                        <span id="currentCountry">USA</span>
                    </div>

                    <div class="flex items-center gap-1 text-slate-500 text-xs sm:text-sm font-medium">
                        <p id="Month"></p>
                        <p id="Date"></p>
                        <p id="Year"></p>
                        <p id="WeekDay"></p>
                        <span class="px-0.5">•</span>
                        <p id="Hour">10</p>
                        <span>:</span>
                        <p id="Minutes">40</p>
                    </div>
                </div>

                <!-- Main Content -->
                <div class="flex flex-col md:flex-row justify-evenly items-center gap-6 pt-2">

                    <!-- Primary Weather: Icon & Temperature -->
                    <div class="flex items-center gap-4 sm:gap-6 w-full md:w-auto justify-center md:justify-start">
                        <img src="Resources/Birght-Sunny.png" alt="Weather Type"
                            class="w-24 h-24 sm:w-32 sm:h-32 object-contain shrink-0">
                        <div class="weather-details flex flex-col gap-0.5">
                            <h1 class="text-4xl sm:text-5xl font-extrabold text-slate-800 tracking-tight">28°C</h1>
                            <p class="text-slate-600 font-semibold text-sm sm:text-base">Sunny Day</p>
                            <p class="text-slate-400 text-xs sm:text-sm">Feels like 30°C</p>
                        </div>
                    </div>

                    <!-- Divider line for mobile layouts -->
                    <div class="w-full md:w-px h-px md:h-24 bg-slate-200/80"></div>

                    <!-- Secondary Metrics -->
                    <div
                        class="OtherDetails grid grid-cols-2 sm:grid-cols-4 md:grid-cols-2 gap-4 sm:gap-6 w-full md:w-auto text-center md:text-left">
                        <div class="flex flex-col">
                            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Humidity</span>
                            <span class="font-bold text-slate-700 text-base sm:text-lg">55%</span>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Wind
                                Speed</span>
                            <span class="font-bold text-slate-700 text-base sm:text-lg">12 km/h</span>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Pressure</span>
                            <span class="font-bold text-slate-700 text-base sm:text-lg">1013 hPa</span>
                        </div>
                        <div class="flex flex-col">
                            <span
                                class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Visibility</span>
                            <span class="font-bold text-slate-700 text-base sm:text-lg">10 km</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="Overview flex flex-col md:flex-row gap-4 w-full">

                <!-- Min/Max Temp Card: Medium Height -->
                <div
                    class="temp flex flex-col justify-evenly gap-3 p-3.5 rounded-xl border border-slate-200/80 bg-white/80 backdrop-blur-sm shadow-xs w-full md:w-fit shrink-0">

                    <div class="font-bold text-lg text-slate-800">
                        Today's Overview
                    </div>

                    <div class="flex items-center justify-around gap-4 sm:gap-6 py-1">
                        <!-- Max Temperature -->
                        <div class="Max flex items-center gap-5">
                            <div class="p-2 rounded-lg bg-rose-500/10 border border-rose-500/20 shrink-0">
                                <img src="https://img.icons8.com/stickers/100/temperature-high.png"
                                    alt="Maximum Temperature" class="w-9 h-9 object-contain">
                            </div>
                            <div class="flex flex-col gap-0.5">
                                <span class="text-base font-semibold text-slate-400 uppercase tracking-wider">Max
                                    Temp</span>
                                <span
                                    class="text-xl font-extrabold text-slate-800 leading-tight after:content-['°C']">30</span>
                            </div>
                        </div>

                        <!-- Vertical Divider -->
                        <div class="w-px h-8 bg-slate-200"></div>

                        <!-- Min Temperature -->
                        <div class="Min flex items-center gap-2.5">
                            <div class="p-2 rounded-lg bg-sky-500/10 border border-sky-500/20 shrink-0">
                                <img src="https://img.icons8.com/stickers/100/temperature-low.png"
                                    alt="Minimum Temperature" class="w-9 h-9 object-contain">
                            </div>
                            <div class="flex flex-col gap-0.5">
                                <span class="text-base font-semibold text-slate-400 uppercase tracking-wider">Min
                                    Temp</span>
                                <span
                                    class="text-xl font-extrabold text-slate-800 leading-tight after:content-['°C']">18</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Hourly Forecast Card: Medium Height -->
                <div
                    class="hourlyForcast flex flex-col justify-between gap-3 p-3.5 rounded-xl border border-slate-200/80 bg-white/80 backdrop-blur-sm shadow-xs flex-1 min-w-0">
                    <div class="header font-bold text-lg text-slate-800">
                        Hourly Forecast
                    </div>

                    <!-- Scrollable details wrapper -->
                    <div class="details flex justify-evenly overflow-x-auto min-w-0 w-full items-center pb-1">
                        <!-- Hour 1 -->
                        <div
                            class="flex flex-col gap-1 justify-center items-center bg-white/90 p-2 rounded-lg border border-slate-100 shrink-0 min-w-16 shadow-2xs">
                            <span class="text-xs font-medium text-slate-500">Now</span>
                            <img src="Resources/Birght-Sunny.png" alt="Sunny" class="w-7 h-7 object-contain shrink-0">
                            <span class="text-sm font-bold text-slate-800 after:content-['°C']">28</span>
                        </div>

                        <!-- Hour 2 -->
                        <div
                            class="flex flex-col gap-1 justify-center items-center bg-white/90 p-2 rounded-lg border border-slate-100 shrink-0 min-w-16 shadow-2xs">
                            <span class="text-xs font-medium text-slate-500">1 PM</span>
                            <img src="Resources/Birght-Sunny.png" alt="Sunny" class="w-7 h-7 object-contain shrink-0">
                            <span class="text-sm font-bold text-slate-800 after:content-['°C']">29</span>
                        </div>

                        <!-- Hour 3 -->
                        <div
                            class="flex flex-col gap-1 justify-center items-center bg-white/90 p-2 rounded-lg border border-slate-100 shrink-0 min-w-16 shadow-2xs">
                            <span class="text-xs font-medium text-slate-500">2 PM</span>
                            <img src="Resources/Birght-Sunny.png" alt="Sunny" class="w-7 h-7 object-contain shrink-0">
                            <span class="text-sm font-bold text-slate-800 after:content-['°C']">30</span>
                        </div>

                        <!-- Hour 4 -->
                        <div
                            class="flex flex-col gap-1 justify-center items-center bg-white/90 p-2 rounded-lg border border-slate-100 shrink-0 min-w-16 shadow-2xs">
                            <span class="text-xs font-medium text-slate-500">3 PM</span>
                            <img src="Resources/Birght-Sunny.png" alt="Sunny" class="w-7 h-7 object-contain shrink-0">
                            <span class="text-sm font-bold text-slate-800 after:content-['°C']">30</span>
                        </div>

                        <!-- Hour 5 -->
                        <div
                            class="flex flex-col gap-1 justify-center items-center bg-white/90 p-2 rounded-lg border border-slate-100 shrink-0 min-w-16 shadow-2xs">
                            <span class="text-xs font-medium text-slate-500">4 PM</span>
                            <img src="Resources/Birght-Sunny.png" alt="Sunny" class="w-7 h-7 object-contain shrink-0">
                            <span class="text-sm font-bold text-slate-800 after:content-['°C']">29</span>
                        </div>
                    </div>
                </div>
            </div>

    </div>
    </main>
    </div>

    <script src="JS/app-UI.js"></script>
</body>

</html>
