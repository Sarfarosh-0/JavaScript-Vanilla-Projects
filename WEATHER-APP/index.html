<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/128/1146/1146869.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <link href="src/output.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            width: 100%;
            min-height: 100vh;
            scroll-behavior: smooth;
        }

        .delhi {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)),
                url('Resources/popular%20cities/Delhi.jpg');
        }

        .london {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)),
                url('Resources/popular%20cities/London.jpg');
        }

        .tokyo {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)),
                url('Resources/popular%20cities/Japan.jpg');
        }

        .dubai {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)),
                url('Resources/popular%20cities/Dubai.jpg');
        }

        .paris {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)),
                url('Resources/popular%20cities/Paris.jpg');
        }

        .lisbon {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)),
                url('Resources/popular%20cities/Lisbon.jpg');
        }

        .city-card {
            background-size: cover;
            background-position: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .city-card:hover {
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.2);
        }

        #currentLocation {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)),
                url('Resources/weather%20backgrounds/Bright-sunny.png');
            background-size: cover;
            background-position: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* Custom Scrollbar for Forecast Row */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-slate-100 flex overflow-x-hidden min-h-screen">

    <!-- Sidebar (Desktop) -->
    <aside id="sidebar" aria-label="Primary Navigation"
        class="fixed hidden top-0 left-0 z-50 w-56 h-full bg-white/80 backdrop-blur-xl border-r border-slate-200/80 md:flex flex-col justify-between transition-transform duration-300 ease-in-out shadow-2xl">

        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-200/80 py-5 px-4 shrink-0">
            <div class="flex items-center gap-3 min-w-0">
                <div
                    class="p-2 rounded-xl bg-sky-500/10 border border-sky-500/20 shrink-0 transition-transform duration-300 hover:rotate-12">
                    <img src="https://cdn-icons-png.flaticon.com/128/1146/1146869.png" alt="App Logo" draggable="false"
                        class="w-6 h-6 object-contain">
                </div>
                <h2 class="font-bold text-lg text-slate-800 tracking-wide truncate">WeatherApp</h2>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="mb-auto flex flex-col gap-1.5 overflow-y-auto px-3 py-4">

            <!-- Home Nav Link -->
            <button type="button"
                class="group flex w-full cursor-pointer items-center gap-3.5 rounded-2xl px-4 py-3 font-semibold text-slate-600 transition-all duration-200 hover:bg-sky-50 hover:text-sky-600 active:scale-95">
                <svg class="h-5 w-5 shrink-0 text-slate-500 transition-transform group-hover:scale-110 group-hover:text-sky-600"
                    fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span class="truncate">Home</span>
            </button>

            <!-- Search Nav Link -->
            <button type="button"
                class="group flex w-full cursor-pointer items-center gap-3.5 rounded-2xl px-4 py-3 font-semibold text-slate-600 transition-all duration-200 hover:bg-sky-50 hover:text-sky-600 active:scale-95">
                <svg class="h-5 w-5 shrink-0 text-slate-500 transition-transform group-hover:scale-110 group-hover:text-sky-600"
                    fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <span class="truncate">Search</span>
            </button>

            <!-- Cities Nav Link -->
            <button type="button"
                class="group flex w-full cursor-pointer items-center gap-3.5 rounded-2xl px-4 py-3 font-semibold text-slate-600 transition-all duration-200 hover:bg-sky-50 hover:text-sky-600 active:scale-95">
                <svg class="h-5 w-5 shrink-0 text-slate-500 transition-transform group-hover:scale-110 group-hover:text-sky-600"
                    fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span class="truncate">Cities</span>
            </button>
        </nav>

        <!-- Bottom Promo Card -->
        <div
            class="m-4 p-4 rounded-2xl flex flex-col justify-center gap-3 items-center bg-linear-to-br from-sky-500 to-blue-600 shadow-md shadow-sky-500/20 shrink-0 text-center transition-transform hover:scale-[1.02] duration-300 cursor-pointer">
            <img src="https://cdn-icons-png.flaticon.com/128/1146/1146869.png" alt="App Logo" draggable="false"
                class="w-7 h-7 object-contain shrink-0 animate-float">
            <p class="font-bold text-white text-xs leading-relaxed">
                Stay ahead of the weather, every day.
            </p>
        </div>
    </aside>

    <div id="mainContent"
        class="flex-1 w-full md:ml-56 transition-all duration-500 ease-in-out p-4 sm:p-6 pb-24 md:pb-6 animate-fade-in min-w-0">
        <header class="relative w-full z-40">
            <!-- Search Form Container -->
            <div
                class="flex h-14 sm:h-16 w-full items-center justify-center rounded-2xl border border-slate-200/80 bg-white/70 p-2 shadow-sm backdrop-blur-md transition-shadow duration-300 hover:shadow-md">
                <div
                    class="group flex h-full flex-1 items-center justify-between gap-3 rounded-xl border border-slate-200/60 bg-slate-50/50 px-3 sm:px-4 transition-all duration-300 focus-within:border-sky-400 focus-within:bg-white focus-within:ring-2 focus-within:ring-sky-400/20">

                    <input type="text" id="searchInput" autocomplete="off"
                        placeholder="Search city (e.g., London, Tokyo)..." aria-label="Search City"
                        class="h-full w-full min-w-0 bg-transparent text-sm sm:text-base font-medium text-slate-700 placeholder:text-slate-400 focus:outline-none" />

                    <button id="searchButton" type="button" aria-label="Submit Search"
                        class="flex shrink-0 items-center justify-center rounded-full bg-sky-100 p-2 text-sky-600 transition-all duration-200 hover:scale-105 hover:bg-sky-600 hover:text-white active:scale-95">
                        <svg class="h-4 w-4 sm:h-5 sm:w-5" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div id="searchResults"
                class="hidden absolute left-0 right-0 top-18 mt-1 max-h-60 overflow-y-auto rounded-2xl border border-slate-200 bg-white/95 p-2 shadow-xl backdrop-blur-md z-50">
            </div>
        </header>

        <main class="flex flex-col gap-5 mt-4">
            <div id="currentLocation"
                class="w-full rounded-2xl p-4 sm:p-6 shadow-xl hover:shadow-2xl border border-slate-200/80 flex flex-col gap-6">

                <!-- Top Row: Location & Date -->
                <div id="dateLocation" class="flex flex-col gap-1">
                    <div class="flex gap-2 items-center font-bold text-slate-800 text-base sm:text-lg">
                        <img src="https://img.icons8.com/ios/100/0284c7/marker--v1.png" alt="Location Icon"
                            draggable="false"
                            class="w-4 h-4 shrink-0 transition-transform duration-300 hover:animate-bounce">
                        <span id="city" class="after:content-[',_']">New York</span>
                        <span id="country">USA</span>
                    </div>

                    <div class="flex items-center gap-1 text-slate-500 text-xs sm:text-sm font-medium flex-wrap">
                        <span id="Month"></span>
                        <span id="Date"></span>
                        <span id="Year"></span>
                        <span id="WeekDay"></span>
                        <span class="px-0.5">•</span>
                        <span id="Hour">10</span>
                        <span>:</span>
                        <span id="Minutes">40</span>
                    </div>
                </div>

                <!-- Main Content -->
                <div class="flex flex-col lg:flex-row justify-between lg:justify-evenly items-center gap-6 pt-2">

                    <!-- Primary Weather: Icon & Temperature -->
                    <div
                        class="locationImage flex items-center gap-4 sm:gap-6 w-full lg:w-auto justify-center lg:justify-start">
                        <img src="" alt="Sunny Weather" draggable="false"
                            class="w-20 h-20 sm:w-28 sm:h-28 lg:w-32 lg:h-32 object-contain shrink-0 animate-float">
                        <div class="weather-details flex flex-col gap-0.5">
                            <h1 id="cityTemp"
                                class=" text-3xl sm:text-5xl font-extrabold text-slate-800 tracking-tight after:content-['_°C']">
                                28</h1>
                            <p id="weatherType" class="text-slate-600 font-semibold text-sm sm:text-base">Sunny Day</p>
                            <p class="text-slate-500 text-[15px] ">
                                Feels like <span id="feelsLikes" class="after:content-['_°C']">57</span>
                            </p>
                        </div>
                    </div>

                    <!-- Divider line -->
                    <div class="w-full lg:w-px h-px lg:h-24 bg-slate-200/80"></div>

                    <!-- Secondary Metrics -->
                    <div
                        class="other-details grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-2 gap-3 sm:gap-6 w-full lg:w-auto text-center lg:text-left">
                        <div class="flex flex-col p-2 rounded-xl transition-all duration-200 hover:bg-white/40">
                            <span
                                class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider">Humidity</span>
                            <span id="humidity"
                                class="font-bold text-slate-700 text-sm sm:text-lg after:content-['_%']">55</span>
                        </div>
                        <div class="flex flex-col p-2 rounded-xl transition-all duration-200 hover:bg-white/40">
                            <span
                                class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider">Wind
                                Speed</span>
                            <span id="windSpeed"
                                class="font-bold text-slate-700 text-sm sm:text-lg after:content-['_km/h']">12</span>
                        </div>
                        <div class="flex flex-col p-2 rounded-xl transition-all duration-200 hover:bg-white/40">
                            <span
                                class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider">Pressure</span>
                            <span id="pressure"
                                class="font-bold text-slate-700 text-sm sm:text-lg after:content-['_hPa']">1013</span>
                        </div>
                        <div class="flex flex-col p-2 rounded-xl transition-all duration-200 hover:bg-white/40">
                            <span
                                class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider">Visibility</span>
                            <span id="visibility"
                                class="font-bold text-slate-700 text-sm sm:text-lg after:content-['_km']">10</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="overview flex flex-col lg:flex-row gap-4 w-full">

                <!-- Min/Max Temp Card -->
                <div
                    class="temp flex flex-col justify-evenly p-4 rounded-xl border border-slate-200/80 bg-white/80 backdrop-blur-sm shadow-sm hover:shadow-md transition-all duration-300 w-full lg:w-fit shrink-0">

                    <div class="font-bold text-base sm:text-lg text-slate-800">
                        Today's Overview
                    </div>

                    <div class="flex items-center justify-around sm:justify-start gap-4 sm:gap-6 py-1">
                        <!-- Max Temperature -->
                        <div class="max flex items-center gap-2 sm:gap-3.5 group cursor-pointer">
                            <div
                                class="p-2 rounded-lg bg-rose-500/10 border border-rose-500/20 shrink-0 transition-transform duration-300 group-hover:scale-110">
                                <img src="https://img.icons8.com/stickers/100/temperature-high.png"
                                    alt="Maximum Temperature" draggable="false"
                                    class="w-7 h-7 sm:w-9 sm:h-9 object-contain">
                            </div>
                            <div class="flex flex-col gap-0.5">
                                <span
                                    class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider">Max
                                    Temp</span>
                                <span id="maxTemp"
                                    class="text-base sm:text-xl font-extrabold text-slate-800 leading-tight after:content-['°C']">30</span>
                            </div>
                        </div>

                        <!-- Vertical Divider -->
                        <div class="w-px h-8 bg-slate-200"></div>

                        <!-- Min Temperature -->
                        <div class="min flex items-center gap-2 sm:gap-3.5 group cursor-pointer">
                            <div
                                class="p-2 rounded-lg bg-sky-500/10 border border-sky-500/20 shrink-0 transition-transform duration-300 group-hover:scale-110">
                                <img src="https://img.icons8.com/stickers/100/temperature-low.png"
                                    alt="Minimum Temperature" draggable="false"
                                    class="w-7 h-7 sm:w-9 sm:h-9 object-contain">
                            </div>
                            <div class="flex flex-col gap-0.5">
                                <span
                                    class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider">Min
                                    Temp</span>
                                <span id="minTemp"
                                    class="text-base sm:text-xl font-extrabold text-slate-800 leading-tight after:content-['°C']">18</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Hourly Forecast Card -->
                <div
                    class="hourly-forecast flex flex-col justify-between gap-3 p-4 rounded-xl border border-slate-200/80 bg-white/80 backdrop-blur-sm shadow-sm hover:shadow-md transition-all duration-300 flex-1 min-w-0">
                    <div class="header font-bold text-base sm:text-lg text-slate-800">
                        Hourly Forecast
                    </div>

                    <div class="details flex items-center justify-between  w-full pb-1 gap-2 sm:gap-3">
                        <!-- Hour 1 -->
                        <div
                            class="flex flex-col gap-1 justify-center items-center bg-white/90 p-2.5 rounded-lg border border-slate-100 shrink-0 flex-1 min-w-17.5 shadow-sm transition-all duration-200 hover:-translate-y-1 hover:shadow-md hover:bg-sky-50/80 hover:border-sky-300 cursor-pointer group">
                            <span class="text-xs font-medium text-slate-500">Now</span>
                            <img src="" alt="Sunny" draggable="false"
                                class="w-7 h-7 object-contain shrink-0 transition-transform duration-300 group-hover:scale-110">
                            <span class="text-sm font-bold text-slate-800 after:content-['°C']">28</span>
                        </div>

                        <!-- Hour 2 -->
                        <div
                            class="flex flex-col gap-1 justify-center items-center bg-white/90 p-2.5 rounded-lg border border-slate-100 shrink-0 flex-1 min-w-17.5 shadow-sm transition-all duration-200 hover:-translate-y-1 hover:shadow-md hover:bg-sky-50/80 hover:border-sky-300 cursor-pointer group">
                            <span class="text-xs font-medium text-slate-500">1 PM</span>
                            <img src="" alt="Sunny" draggable="false"
                                class="w-7 h-7 object-contain shrink-0 transition-transform duration-300 group-hover:scale-110">
                            <span class="text-sm font-bold text-slate-800 after:content-['°C']">29</span>
                        </div>

                        <!-- Hour 3 -->
                        <div
                            class="flex flex-col gap-1 justify-center items-center bg-white/90 p-2.5 rounded-lg border border-slate-100 shrink-0 flex-1 min-w-17.5 shadow-sm transition-all duration-200 hover:-translate-y-1 hover:shadow-md hover:bg-sky-50/80 hover:border-sky-300 cursor-pointer group">
                            <span class="text-xs font-medium text-slate-500">2 PM</span>
                            <img src="" alt="Sunny" draggable="false"
                                class="w-7 h-7 object-contain shrink-0 transition-transform duration-300 group-hover:scale-110">
                            <span class="text-sm font-bold text-slate-800 after:content-['°C']">30</span>
                        </div>

                        <!-- Hour 4 -->
                        <div
                            class="flex flex-col gap-1 justify-center items-center bg-white/90 p-2.5 rounded-lg border border-slate-100 shrink-0 flex-1 min-w-17.5 shadow-sm transition-all duration-200 hover:-translate-y-1 hover:shadow-md hover:bg-sky-50/80 hover:border-sky-300 cursor-pointer group">
                            <span class="text-xs font-medium text-slate-500">3 PM</span>
                            <img src="" alt="Sunny" draggable="false"
                                class="w-7 h-7 object-contain shrink-0 transition-transform duration-300 group-hover:scale-110">
                            <span class="text-sm font-bold text-slate-800 after:content-['°C']">30</span>
                        </div>

                        <!-- Hour 5 -->
                        <div
                            class="flex flex-col gap-1 justify-center items-center bg-white/90 p-2.5 rounded-lg border border-slate-100 shrink-0 flex-1 min-w-17.5 shadow-sm transition-all duration-200 hover:-translate-y-1 hover:shadow-md hover:bg-sky-50/80 hover:border-sky-300 cursor-pointer group">
                            <span class="text-xs font-medium text-slate-500">4 PM</span>
                            <img src="" alt="Sunny" draggable="false"
                                class="w-7 h-7 object-contain shrink-0 transition-transform duration-300 group-hover:scale-110">
                            <span class="text-sm font-bold text-slate-800 after:content-['°C']">29</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Popular Cities -->
            <div
                class="cities-outer-box flex w-full flex-col gap-4 rounded-2xl border border-slate-200/80 bg-white/80 p-4 sm:p-6 backdrop-blur-md shadow-xl">

                <h2 class="text-base sm:text-lg font-bold text-slate-800">
                    Popular Cities
                </h2>

                <div class="popular-cities grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">

                    <!-- Delhi -->
                    <button type="button"
                        class="delhi city-card group flex flex-col justify-between rounded-2xl border border-slate-200 bg-white/50 p-3 text-left transition-all duration-200 hover:-translate-y-1 hover:border-sky-300 hover:bg-sky-50/50 hover:shadow-md active:scale-95">
                        <div class="city-header flex items-center justify-between gap-2">
                            <img id="delhiIcon" src="" alt="Heavy Rain Weather" draggable="false"
                                class="h-8 w-8 sm:h-10 sm:w-10 shrink-0 object-contain transition-transform duration-300 group-hover:scale-110">
                            <div class="flex flex-col text-right">
                                <span class="text-xs font-bold uppercase tracking-wider text-slate-800">Delhi</span>
                                <span class="text-[10px] font-semibold text-slate-500">India</span>
                            </div>
                        </div>
                        <div class="mt-2 text-center">
                            <span id="delhiTemp"
                                class="text-lg sm:text-xl font-bold text-slate-800 after:content-['°C']">30</span>
                        </div>
                    </button>

                    <!-- London -->
                    <button type="button"
                        class="london city-card group flex flex-col justify-between rounded-2xl border border-slate-200 bg-white/50 p-3 text-left transition-all duration-200 hover:-translate-y-1 hover:border-sky-300 hover:bg-sky-50/50 hover:shadow-md active:scale-95">
                        <div class="city-header flex items-center justify-between gap-2">
                            <img id="londonIcon" src="" alt="Sunny Weather" draggable="false"
                                class="h-8 w-8 sm:h-10 sm:w-10 shrink-0 object-contain transition-transform duration-300 group-hover:scale-110">
                            <div class="flex flex-col text-right">
                                <span class="text-xs font-bold uppercase tracking-wider text-slate-800">London</span>
                                <span class="text-[10px] font-semibold text-slate-500">UK</span>
                            </div>
                        </div>
                        <div class="mt-2 text-center">
                            <span id="londonTemp"
                                class="text-lg sm:text-xl font-bold text-slate-800 after:content-['°C']">19</span>
                        </div>
                    </button>

                    <!-- Tokyo -->
                    <button type="button"
                        class="tokyo city-card group flex flex-col justify-between rounded-2xl border border-slate-200 bg-white/50 p-3 text-left transition-all duration-200 hover:-translate-y-1 hover:border-sky-300 hover:bg-sky-50/50 hover:shadow-md active:scale-95">
                        <div class="city-header flex items-center justify-between gap-2">
                            <img id="tokyoIcon" src="" alt="Light Rain Weather" draggable="false"
                                class="h-8 w-8 sm:h-10 sm:w-10 shrink-0 object-contain transition-transform duration-300 group-hover:scale-110">
                            <div class="flex flex-col text-right">
                                <span class="text-xs font-bold uppercase tracking-wider text-slate-800">Tokyo</span>
                                <span class="text-[10px] font-semibold text-slate-500">Japan</span>
                            </div>
                        </div>
                        <div class="mt-2 text-center">
                            <span id="tokyoTemp"
                                class="text-lg sm:text-xl font-bold text-slate-800 after:content-['°C']">26</span>
                        </div>
                    </button>

                    <!-- Dubai -->
                    <button type="button"
                        class="dubai city-card group flex flex-col justify-between rounded-2xl border border-slate-200 bg-white/50 p-3 text-left transition-all duration-200 hover:-translate-y-1 hover:border-sky-300 hover:bg-sky-50/50 hover:shadow-md active:scale-95">
                        <div class="city-header flex items-center justify-between gap-2">
                            <img id="dubaiIcon" src="" alt="Clear Night Weather" draggable="false"
                                class="h-8 w-8 sm:h-10 sm:w-10 shrink-0 object-contain transition-transform duration-300 group-hover:scale-110">
                            <div class="flex flex-col text-right">
                                <span class="text-xs font-bold uppercase tracking-wider text-slate-800">Dubai</span>
                                <span class="text-[10px] font-semibold text-slate-500">UAE</span>
                            </div>
                        </div>
                        <div class="mt-2 text-center">
                            <span id="dubaiTemp"
                                class="text-lg sm:text-xl font-bold text-slate-800 after:content-['°C']">38</span>
                        </div>
                    </button>

                    <!-- Paris -->
                    <button type="button"
                        class="paris city-card group flex flex-col justify-between rounded-2xl border border-slate-200 bg-white/50 p-3 text-left transition-all duration-200 hover:-translate-y-1 hover:border-sky-300 hover:bg-sky-50/50 hover:shadow-md active:scale-95">
                        <div class="city-header flex items-center justify-between gap-2">
                            <img id="parisIcon" src="" alt="Windy Weather" draggable="false"
                                class="h-8 w-8 sm:h-10 sm:w-10 shrink-0 object-contain transition-transform duration-300 group-hover:scale-110">
                            <div class="flex flex-col text-right">
                                <span class="text-xs font-bold uppercase tracking-wider text-slate-800">Paris</span>
                                <span class="text-[10px] font-semibold text-slate-500">France</span>
                            </div>
                        </div>
                        <div class="mt-2 text-center">
                            <span id="parisTemp"
                                class="text-lg sm:text-xl font-bold text-slate-800 after:content-['°C']">22</span>
                        </div>
                    </button>

                    <!-- Lisbon -->
                    <button type="button"
                        class="lisbon city-card group flex flex-col justify-between rounded-2xl border border-slate-200 bg-white/50 p-3 text-left transition-all duration-200 hover:-translate-y-1 hover:border-sky-300 hover:bg-sky-50/50 hover:shadow-md active:scale-95">
                        <div class="city-header flex items-center justify-between gap-2">
                            <img id="lisbonIcon" src="" alt="Overcast Weather" draggable="false"
                                class="h-8 w-8 sm:h-10 sm:w-10 shrink-0 object-contain transition-transform duration-300 group-hover:scale-110">
                            <div class="flex flex-col text-right">
                                <span class="text-xs font-bold uppercase tracking-wider text-slate-800">Lisbon</span>
                                <span class="text-[10px] font-semibold text-slate-500">Portugal</span>
                            </div>
                        </div>
                        <div class="mt-2 text-center">
                            <span id="lisbonTemp"
                                class="text-lg sm:text-xl font-bold text-slate-800 after:content-['°C']">25</span>
                        </div>
                    </button>
                </div>
            </div>

        </main>
    </div>

    <!-- Mobile Navigation Bar -->
    <footer
        class="fixed bottom-0 left-0 right-0 z-50 flex h-16 w-full items-center justify-around border-t border-slate-200 bg-white/90 backdrop-blur-md md:hidden">

        <!-- Home Button -->
        <button type="button" aria-label="Home"
            class="group flex flex-1 items-center justify-center py-2 text-slate-500 transition-all duration-200 hover:text-sky-600 active:scale-95">
            <svg class="h-6 w-6 transition-transform group-hover:scale-110" fill="none" stroke="currentColor"
                stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />

        <!-- Search Button -->
        <button type="button" aria-label="Search"

            <svg class="h-6 w-6 transition-transform group-hover:scale-110" fill="none" stroke="currentColor"

        <!-- Cities Button -->
        <button type="button" aria-label="Cities"

            <svg class="h-6 w-6 transition-transform group-hover:scale-110" fill="none" stroke="currentColor"
                stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"

                <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </button>

    </footer>
