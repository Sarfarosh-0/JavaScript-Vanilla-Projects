<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/128/1146/1146869.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <link href="src/output.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }
    </style>
</head>

<body class="bg-slate-100">

    <aside class="translate-x-ful w-1/2 min-h-full bg-white border-r-2 border-slate-400">
        <div class="sidebarHeader flex gap-3 items-center justify-center border-b py-3">
            <img src="https://cdn-icons-png.flaticon.com/128/1146/1146869.png" alt="App Logo"
                class="w-10 h-10 aspect-square object-contain">
            <h2 class="font-bold">Weather App</h2>
        </div>

        <nav class="flex flex-col justify-center items-start gap-2 pt-3 mx-2">
            <button
                class="w-full flex justify-start items-center gap-3 text-slate-700 font-bold rounded-2xl hover:bg-blue-500 hover:text-white transition-all duration-300 py-2 px-4">
                <img src="https://img.icons8.com/material-outlined/24/home--v2.png" alt="Home"
                    class="w-6 h-6 aspect-square">
                <h3>Home</h3>
            </button>

            <button
                class="w-full flex justify-start items-center gap-3 text-slate-700 font-bold rounded-2xl hover:bg-blue-500 hover:text-white transition-all duration-300 py-2 px-4">
                <img src="https://img.icons8.com/ios-glyphs/30/search--v1.png" alt="Search"
                    class="w-6 h-6 aspect-square">
                <h3>Search</h3>
            </button>

            <button
                class="w-full flex justify-start items-center gap-3 text-slate-700 font-bold rounded-2xl hover:bg-blue-500 hover:text-white transition-all duration-300 py-2 px-4">
                <img src="https://img.icons8.com/ios/100/marker--v1.png" alt="Cities" class="w-6 h-6 aspect-square">
                <h3>Cities</h3>
            </button>

            <button
                class="w-full flex justify-start items-center gap-3 text-slate-700 font-bold rounded-2xl hover:bg-blue-500 hover:text-white transition-all duration-300 py-2 px-4">
                <img src="https://img.icons8.com/material-outlined/24/like--v1.png" alt="Favorites"
                    class="w-6 h-6 aspect-square">
                <h3>Favorites</h3>
            </button>
        </nav>

        <div></div>
    </aside>

</body>

</html>
